<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Oficial de Kanto (151)</title>
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111116;
            --card-bg: #1a1a24;
            --sub-card-bg: #14141d;
            --border-color: #2a2a3c;
            --text-color: #f0f0f5;
            --text-muted: #8e8ea4;
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --theme-glow: rgba(255, 83, 80, 0.25);
            --primary-color: #ff5350;
        }

        body.retro-mode {
            --bg-color: #8b956d;
            --card-bg: #9bbc0f;
            --sub-card-bg: #8bac0f;
            --border-color: #0f380f;
            --text-color: #0f380f;
            --text-muted: #306230;
            --font-family: 'Press Start 2P', monospace;
            --theme-glow: none;
            --primary-color: #0f380f;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            margin: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        body.retro-mode .card,
        body.retro-mode select,
        body.retro-mode button,
        body.retro-mode .description,
        body.retro-mode .sprite-box,
        body.retro-mode .evo-node,
        body.retro-mode .badge,
        body.retro-mode .nav-btn,
        body.retro-mode .view-mode-btn,
        body.retro-mode .rank-pill {
            border: 2px solid #0f380f !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-link {
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-link:hover {
            border-color: var(--primary-color);
        }

        .btn-toggle-theme {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
        }

        /* Barra de Filtro de Ranks */
        .rank-filter-bar {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 0.8rem;
            overflow-x: auto;
        }

        .rank-pill {
            flex: 1;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .rank-pill.active {
            background: var(--sub-card-bg);
            color: #fff;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        .nav-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 1rem;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
        }

        select {
            flex: 1;
            padding: 10px;
            font-size: 0.88rem;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        /* Card Pokédex */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 1.4rem;
            box-shadow: 0 10px 30px var(--theme-glow);
            border: 1px solid var(--border-color);
        }

        .sprite-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .sprite-box {
            background: var(--sub-card-bg);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 86px;
            height: 86px;
            border: 1px solid var(--border-color);
        }

        .view-mode-selector {
            display: flex;
            gap: 3px;
            background: var(--sub-card-bg);
            padding: 2px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .view-mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .view-mode-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            margin-right: 4px;
        }

        .description {
            font-size: 0.82rem;
            line-height: 1.45;
            color: var(--text-muted);
            background: var(--sub-card-bg);
            padding: 10px;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid var(--primary-color);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 2px;
        }

        .bar-bg {
            background: var(--sub-card-bg);
            border-radius: 4px;
            height: 7px;
            overflow: hidden;
            margin-bottom: 7px;
        }

        .bar-fill {
            background: var(--primary-color);
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
        }

        .matchup-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 0.6rem;
        }

        .matchup-chip {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .evolution-chain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .evo-node {
            background: var(--sub-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .evo-node.active {
            border: 2px solid var(--primary-color);
        }

        .evo-node img {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }

        .evo-node span {
            font-size: 0.65rem;
            margin-top: 2px;
            font-weight: bold;
        }

        /* ================= RESPONSIVIDADE ================= */

        /* Tablet: mais espaço para o card e sprites maiores */
        @media (min-width: 600px) {
            .container { max-width: 640px; }
            .card { padding: 1.8rem; }
            .sprite-box { width: 104px; height: 104px; }
            .top-bar h2 { font-size: 1.3rem; }
        }

        /* Desktop: aproveita a largura sem esticar o conteúdo em excesso */
        @media (min-width: 1024px) {
            .container { max-width: 760px; }
            .card { padding: 2.2rem; }
            .sprite-box { width: 120px; height: 120px; }
        }

        /* Celulares pequenos: reduz respiro para caber sem cortar */
        @media (max-width: 380px) {
            body { padding: 0.6rem; }
            .card { padding: 1rem; }
            .sprite-box { width: 72px; height: 72px; }
            .top-bar h2 { font-size: 0.95rem; }
            .btn-link { font-size: 0.68rem; padding: 5px 9px; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <div class="nav-links">
                <a href="/" class="btn-link">🎮 Ir para o Jogo</a>
                <h2 style="display: inline; margin: 0 0 0 4px; font-size: 1.1rem;">📖 Pokédex Kanto</h2>
            </div>
            <button id="btn-toggle-retro" class="btn-toggle-theme">🎮 Game Boy</button>
        </div>

        <!-- Filtro por Rank -->
        <div class="rank-filter-bar">
            <button class="rank-pill active" data-rank="ALL">Todos (151)</button>
            <button class="rank-pill" data-rank="S">👑 S</button>
            <button class="rank-pill" data-rank="A">💎 A</button>
            <button class="rank-pill" data-rank="B">🥇 B</button>
            <button class="rank-pill" data-rank="C">🥈 C</button>
            <button class="rank-pill" data-rank="D">🥉 D</button>
        </div>

        <!-- Navegação -->
        <div class="nav-bar">
            <button id="btn-prev" class="nav-btn">◀</button>
            <select id="pokemon-select"></select>
            <button id="btn-next" class="nav-btn">▶</button>
        </div>

        <!-- Card de Detalhes -->
        <div class="card" id="pokemon-card">
            <div style="display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                <div class="sprite-wrapper">
                    <div class="sprite-box">
                        <img id="poke-sprite" src="" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>
                    <div class="view-mode-selector">
                        <button class="view-mode-btn active" data-mode="sprite">👾 Pixel</button>
                        <button class="view-mode-btn" data-mode="animated">🎬 GIF</button>
                        <button class="view-mode-btn" data-mode="artwork">🎨 HD</button>
                    </div>
                </div>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 id="poke-name" style="margin: 0; font-size: 1.05rem;"></h3>
                        <button id="btn-play-cry" class="nav-btn" style="padding: 4px 8px; font-size: 0.8rem;">🔊</button>
                    </div>
                    <div id="poke-rank-badge" style="margin: 4px 0;"></div>
                    <div id="poke-types"></div>
                    <small id="poke-measurements" style="color: var(--text-muted); font-size: 0.72rem;"></small>
                </div>
            </div>

            <div id="poke-flavor" class="description"></div>

            <h4><span>Stats Base</span> <span id="poke-bst" style="font-size: 0.75rem; color: var(--text-muted);"></span></h4>
            <div id="poke-stats"></div>

            <h4 style="margin-top: 0.8rem;">Fraquezas & Defesas</h4>
            <div id="poke-weaknesses" class="matchup-grid"></div>
            <div id="poke-resistances" class="matchup-grid"></div>

            <h4 style="margin-top: 0.8rem;">Cadeia Evolutiva</h4>
            <div id="poke-evolutions" class="evolution-chain"></div>
        </div>
    </div>

    <script>
        const TYPE_COLORS = {
            normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C',
            grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
            ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
            rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', steel: '#B7B7CE', fairy: '#D685AD'
        };

        const pokedexSelect = document.getElementById('pokemon-select');
        const pokeSpriteImg = document.getElementById('poke-sprite');
        const viewModeBtns = document.querySelectorAll('.view-mode-btn');
        const rankPills = document.querySelectorAll('.rank-pill');

        let fullPokemonList = [];
        let filteredPokemonList = [];
        let currentPokemonData = null;
        let currentSpriteMode = 'sprite';
        let currentRankFilter = 'ALL';

        const cryAudio = new Audio();
        cryAudio.volume = 0.5;

        // Alternar Tema Retro
        document.getElementById('btn-toggle-retro').addEventListener('click', () => {
            document.body.classList.toggle('retro-mode');
            const isRetro = document.body.classList.contains('retro-mode');
            document.getElementById('btn-toggle-retro').innerText = isRetro ? '✨ Moderno' : '🎮 Game Boy';
        });

        viewModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                viewModeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSpriteMode = btn.dataset.mode;
                updatePokedexSprite();
            });
        });

        function updatePokedexSprite() {
            if (!currentPokemonData) return;
            let targetUrl = currentPokemonData.sprite;
            if (currentSpriteMode === 'animated') targetUrl = currentPokemonData.sprite_animated;
            else if (currentSpriteMode === 'artwork') targetUrl = currentPokemonData.artwork;
            pokeSpriteImg.src = targetUrl;
        }

        rankPills.forEach(pill => {
            pill.addEventListener('click', () => {
                rankPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentRankFilter = pill.dataset.rank;
                applyPokedexFilter();
            });
        });

        function applyPokedexFilter() {
            if (currentRankFilter === 'ALL') filteredPokemonList = [...fullPokemonList];
            else filteredPokemonList = fullPokemonList.filter(p => p.rank === currentRankFilter);
            pokedexSelect.innerHTML = filteredPokemonList.map(mon => `
                <option value="${mon.id}">#${String(mon.id).padStart(3, '0')} - ${mon.name.charAt(0).toUpperCase() + mon.name.slice(1)} [${mon.rank}]</option>
            `).join('');
            if (filteredPokemonList.length > 0) {
                pokedexSelect.value = filteredPokemonList[0].id;
                loadPokedexPokemon(filteredPokemonList[0].id, false);
            }
        }

        async function loadPokedexPokemon(id, playAudio = false) {
            try {
                const res = await fetch(`/api/pokemon/${id}`);
                const data = await res.json();
                currentPokemonData = data;
                pokedexSelect.value = data.id;

                updatePokedexSprite();
                document.getElementById('poke-name').innerText = `#${String(data.id).padStart(3, '0')} ${data.name}`;
                document.getElementById('poke-measurements').innerText = `Alt: ${data.height}m | Peso: ${data.weight}kg`;

                const rankInfo = data.rank_info || { name: `Rank ${data.rank}`, badge_bg: '#999' };
                document.getElementById('poke-rank-badge').innerHTML = `
                    <span class="badge" style="background: ${rankInfo.badge_bg}; color: #111; font-weight: 800;">
                        ${rankInfo.name} • BST ${data.bst}
                    </span>
                `;

                document.getElementById('poke-types').innerHTML = data.types.map(t => `
                    <span class="badge" style="background: ${TYPE_COLORS[t.toLowerCase()] || '#777'};">${t}</span>
                `).join('');

                document.getElementById('poke-flavor').innerText = `"${data.flavor}"`;

                document.getElementById('poke-stats').innerHTML = data.stats.map(s => `
                    <div class="stat-row"><span>${s.name}</span><span><strong>${s.val}</strong></span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: ${Math.min((s.val / 250) * 100, 100)}%;"></div></div>
                `).join('');
                document.getElementById('poke-bst').innerText = `Total: ${data.bst}`;

                // Fraquezas e Defesas
                const weakContainer = document.getElementById('poke-weaknesses');
                const resistContainer = document.getElementById('poke-resistances');
                weakContainer.innerHTML = data.matchups.weaknesses.map(w => `
                    <div class="matchup-chip"><span class="badge" style="background:${TYPE_COLORS[w.type.toLowerCase()] || '#777'};">${w.type}</span> <strong>${w.multiplier}x</strong></div>
                `).join('') || '<span style="font-size:0.7rem; color:var(--text-muted);">Sem fraquezas especiais</span>';

                resistContainer.innerHTML = data.matchups.resistances.map(r => `
                    <div class="matchup-chip"><span class="badge" style="background:${TYPE_COLORS[r.type.toLowerCase()] || '#777'};">${r.type}</span> <strong>${r.multiplier}x</strong></div>
                `).join('') || '<span style="font-size:0.7rem; color:var(--text-muted);">Sem resistências especiais</span>';

                // Evoluções
                const evoContainer = document.getElementById('poke-evolutions');
                evoContainer.innerHTML = (data.evolution_chain || []).map((stage, idx) => `
                    <div class="evo-node ${stage.id === data.id ? 'active' : ''}" onclick="loadPokedexPokemon(${stage.id}, true)">
                        <img src="${stage.sprite}" alt="${stage.name}">
                        <span>${stage.name}</span>
                    </div>
                    ${idx < data.evolution_chain.length - 1 ? '<span style="color:var(--text-muted);">➔</span>' : ''}
                `).join('') || '<span style="font-size:0.7rem; color:var(--text-muted);">Sem evolução</span>';

                cryAudio.src = data.cry_url;
                if (playAudio) { cryAudio.currentTime = 0; cryAudio.play().catch(() => {}); }
            } catch (err) {
                console.error("Erro ao carregar Pokémon:", err);
                showError("Não foi possível carregar este Pokémon. Tente novamente.");
            }
        }

        function showError(msg) {
            let toast = document.getElementById('error-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'error-toast';
                toast.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#ff5350;color:#fff;padding:10px 18px;border-radius:8px;font-size:0.85rem;font-weight:700;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.4);';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.display = 'block';
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        document.getElementById('btn-prev').addEventListener('click', () => {
            const idx = filteredPokemonList.findIndex(p => p.id === parseInt(pokedexSelect.value, 10));
            if (idx > 0) loadPokedexPokemon(filteredPokemonList[idx - 1].id, true);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            const idx = filteredPokemonList.findIndex(p => p.id === parseInt(pokedexSelect.value, 10));
            if (idx < filteredPokemonList.length - 1) loadPokedexPokemon(filteredPokemonList[idx + 1].id, true);
        });

        pokedexSelect.addEventListener('change', (e) => loadPokedexPokemon(e.target.value, true));
        document.getElementById('btn-play-cry').addEventListener('click', () => { if (cryAudio.src) { cryAudio.currentTime = 0; cryAudio.play(); } });

        async function init() {
            try {
                const res = await fetch('/api/ranks');
                const data = await res.json();
                fullPokemonList = [];
                ['S', 'A', 'B', 'C', 'D'].forEach(t => (data.ranks[t] || []).forEach(m => fullPokemonList.push(m)));
                fullPokemonList.sort((a, b) => a.id - b.id);
                filteredPokemonList = [...fullPokemonList];
                applyPokedexFilter();
                loadPokedexPokemon(25, false);
            } catch (err) {
                console.error("Erro na Pokédex:", err);
                showError("Falha ao carregar a lista de Pokémon. Recarregue a página.");
            }
        }

        // Sprite de CDN externo (pokesprite/PokeAPI) pode falhar; evita ícone de imagem quebrada.
        document.addEventListener('error', e => {
            if (e.target.tagName === 'IMG' && !e.target.dataset.fallbackApplied) {
                e.target.dataset.fallbackApplied = '1';
                e.target.style.opacity = '0.15';
                e.target.style.filter = 'grayscale(1)';
            }
        }, true);

        init();
    </script>
</body>

</html>
